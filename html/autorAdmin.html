    <h1>Aутори</h1>

    <div class="table-wrapper" >
    <table id="tableAdmin">
        <tr>
            <th></th>
            <th>Име</th>
            <th>Презиме</th>
            <th>Датум рођења</th>
            <th>Број освојених награда</th>
            <th>Број продатих примерака</th>
            <th>Статус аутора</th>
            <th>Број телефона менаџера</th>
        </tr>      
    </table>
    </div>

    <form id="authorForm" class="crud">
        <div>
            <label for="ime">Име</label>
            <input type="text" id="ime" placeholder="Име" name="ime">
        </div>
        <div>
            <label for="prezime">Презиме</label>
            <input name="prezime" type="text" id="prezime" placeholder="Презиме" required>
        </div>
        <div>
            <label for="dat_rodj">Датум рођења</label>
            <input name="datrodj" type="date" id="dat_rodj" required>
        </div>
        <div>
            <label for="broj-nag">Број освојених награда</label>
            <input name="brojnag" type="number" id="broj-nag" placeholder="Број освојених награда" min="0" required>
        </div>
        <div>
            <label for="broj-prim">Број продатих примерака</label>
            <input name="brojprim" type="number" id="broj-prim" placeholder="Број продатих примерака" min="0" required>
        </div>

        <div>
            <label for="status">Статус</label>
            <select name="status" id="status">
                <option value="Активан">Активан</option>
                <option value="Упензији">У пензији</option>
                <option value="Преминуо">Преминуо</option>
            </select>
        </div>
        <div>
            <label for="tel">Број телефона</label>
            <input name="brojtel" type="tel" id="tel" value="+381 "
            pattern="^\+381\s?[67]\d{7,8}$" 
            title="Унесите број у формату: +381 6XXXXXXXX"
            required>
        </div>

        <div class="buttons">
            <button type="button" id="updateBtn">Измени</button>
            <button type="submit" id="addBtn">Додај</button>
            <button type="button" id="deleteBtn">Избриши</button>  
        </div>
    </form>

    <dialog id="btnDel">
        <div class="content">
            <p>Потврди брисање</p>
            <div class="btns">
                <button type="button" id="okBTN">ok</button>
                <button type="button" id="cancelBTN">cancel</button>
            </div>
        </div>
    </dialog>

    <div class="footer">
            <a href="https://github.com/Ieontina">Ieontina</a>
            <a href="https://github.com/Syihlent">Syihlent</a>
    </div>

    <script src="../js/adminAuthor.js"></script>
    <script src="../js/deleteBtnAuthor.js"></script>
    <script src="../js/main.js"></script>
    
</body>
